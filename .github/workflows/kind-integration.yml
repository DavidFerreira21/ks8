name: Kind integration labs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Por PR/ref, sem fila global: a revisão mais nova substitui runs antigas.
  group: kind-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kind-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python dependencies
        run: python -m pip install 'PyYAML>=6,<7'

      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Create Kind cluster (1 Control Plane + 2 Workers)
        uses: helm/kind-action@v1.15.2
        with:
          cluster_name: dev
          config: kind-config.yaml
          wait: 120s

      - name: Confirm target
        run: |
          kubectl config current-context
          kubectl get nodes -o wide
          test "$(kubectl config current-context)" = "kind-dev"

      - name: Run integrated labs
        run: bash scripts/ci-kind-smoke.sh

      - name: Run Camada 03 integrated labs
        run: bash scripts/ci-kind-layer03.sh

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kind-lab-diagnostics
          path: /tmp/kvg-lab-reports/
          if-no-files-found: ignore
          retention-days: 7
