name: Validate labs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML parser
        run: python -m pip install 'PyYAML>=6,<7'

      - name: Validate example manifests
        run: python scripts/validate_manifests.py

      - name: Verify shell syntax
        run: |
          if [ -f scripts/lab-diagnostics.sh ]; then bash -n scripts/lab-diagnostics.sh; fi
