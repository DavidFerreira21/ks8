name: Validate labs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML parser
        run: python -m pip install 'PyYAML>=6,<7'

      - name: Check canonical Makefile and lab commands
        run: |
          test -f Makefile
          test ! -f makefile
          make -n labs > /dev/null
          make -n lab-observe LAB=01.06 > /dev/null
          make -n lab-experiment LAB=01.06 EXPERIMENT=controlled-rollout > /dev/null
          make -n new-lab LAB_ID=01.10 LAB_SLUG=configmaps-basico > /dev/null

      - name: Validate example manifests
        run: python scripts/validate_manifests.py

      - name: Verify shell syntax
        run: |
          if [ -f scripts/lab-diagnostics.sh ]; then bash -n scripts/lab-diagnostics.sh; fi
