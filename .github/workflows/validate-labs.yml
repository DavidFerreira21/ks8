name: Validate labs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML parser
        run: python -m pip install 'PyYAML>=6,<7'

      - name: Check canonical Makefile and lab commands
        run: |
          test -f Makefile
          test ! -f makefile
          make -n labs > /dev/null
          make -n lab-prepare LAB=01.02 > /dev/null
          make -n lab-apply LAB=02.09 > /dev/null
          make -n lab-reset LAB=01.02 > /dev/null
          make -n lab-solution LAB=01.02 > /dev/null
          make -n lab-observe LAB=01.05 > /dev/null
          make -n lab-experiment LAB=01.12 EXPERIMENT=controlled-rollout > /dev/null
          make -n new-lab LAB_ID=01.07 LAB_SLUG=configmaps-basico > /dev/null

      - name: Validate Markdown links and course navigation
        run: |
          python scripts/check_navigation.py
          python -m unittest discover -s tests -p 'test_navigation.py' -v

      - name: Validate example manifests
        run: |
          python scripts/validate_manifests.py
          python scripts/validate_lab_resources.py

      - name: Full unit tests and semantic validation (52 labs)
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          make validate

      - name: Verify shell scripts use LF and pass Bash syntax
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            echo "Checking ${script}"
            if LC_ALL=C grep -q "$(printf '\015')" "$script"; then
              echo "::error file=${script}::Shell script uses CRLF; convert to LF" >&2
              exit 1
            fi
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print0)
