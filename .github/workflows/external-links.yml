name: External links audit

on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify HTTP links
        run: python3 scripts/check_external_links.py --strict --timeout 10 --workers 4
      - name: Upload link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-links-report
          path: external-links-report.txt
          if-no-files-found: warn
          retention-days: 14
