apiVersion: v1
kind: Pod
metadata:
  name: escritor
  namespace: lab-01-11
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sh", "-c", "echo persistente > /dados/mensagem.txt; sleep 3600"]
      volumeMounts:
        - name: dados
          mountPath: /dados
      resources:
        requests: {cpu: 5m, memory: 8Mi}
        limits: {cpu: 50m, memory: 32Mi}
  volumes:
    - name: dados
      persistentVolumeClaim:
        claimName: dados-pvc
