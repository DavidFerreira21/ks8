# O Deployment é apenas um backend de teste para o Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lab-01-05
spec:
  replicas: 2
  selector:
    matchLabels:
      app: services-demo
  template:
    metadata:
      labels:
        app: services-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
