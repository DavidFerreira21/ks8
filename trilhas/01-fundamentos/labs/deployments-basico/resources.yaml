apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lab-01-03
spec:
  replicas: 3
  selector:
    matchLabels: {app: web-0103}
  template:
    metadata:
      labels: {app: web-0103}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
