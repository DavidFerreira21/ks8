apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lab-01-13
spec:
  replicas: 1
  selector:
    matchLabels: {app: ingress-demo}
  template:
    metadata:
      labels: {app: ingress-demo}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: lab-01-13
spec:
  selector: {app: ingress-demo}
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: lab-01-13
spec:
  ingressClassName: traefik
  rules:
    - host: aula.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
