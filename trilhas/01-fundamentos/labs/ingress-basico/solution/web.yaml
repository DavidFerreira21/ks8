apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: lab-01-13
spec:
  ingressClassName: traefik
  rules:
    - host: aula.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
