apiVersion: v1
kind: Pod
metadata:
  name: pod-demo
  namespace: lab-01-02
  labels:
    app: pod-demo
spec:
  containers:
    - name: principal
      image: busybox:1.36
      command: ["sh", "-c", "echo pod-iniciado; sleep 3600"]
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 64Mi}
