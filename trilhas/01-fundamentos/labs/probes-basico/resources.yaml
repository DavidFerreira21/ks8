apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lab-01-10
spec:
  replicas: 1
  selector:
    matchLabels: {app: probes-demo}
  template:
    metadata:
      labels: {app: probes-demo}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
