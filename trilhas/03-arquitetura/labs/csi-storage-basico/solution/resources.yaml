apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dados
  namespace: lab-03-15
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: escritor
  namespace: lab-03-15
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "test -f /dados/marcador.txt || echo criado > /dados/marcador.txt; sleep 3600"]
      volumeMounts:
        - name: dados
          mountPath: /dados
  volumes:
    - name: dados
      persistentVolumeClaim:
        claimName: dados
