apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dados-csi
  namespace: lab-03-15
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: csi-hostpath-lab-03-15
  resources:
    requests:
      storage: 128Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: escritor-csi
  namespace: lab-03-15
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "test -f /dados/marcador.txt || echo csi-ok > /dados/marcador.txt; sleep 3600"]
      volumeMounts:
        - name: dados
          mountPath: /dados
  volumes:
    - name: dados
      persistentVolumeClaim:
        claimName: dados-csi
