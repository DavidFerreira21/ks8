apiVersion: apps/v1
kind: Deployment
metadata:
  name: percurso
  namespace: lab-03-01
spec:
  replicas: 2
  selector:
    matchLabels:
      app: percurso
  template:
    metadata:
      labels:
        app: percurso
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - containerPort: 80
