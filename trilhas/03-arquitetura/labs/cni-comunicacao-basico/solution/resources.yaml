apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lab-03-12
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
---
apiVersion: v1
kind: Pod
metadata:
  name: cliente
  namespace: lab-03-12
spec:
  containers:
    - name: cliente
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
