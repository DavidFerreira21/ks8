apiVersion: apps/v1
kind: Deployment
metadata:
  name: operator-demo
  namespace: lab-03-07
spec:
  replicas: 2
  selector:
    matchLabels:
      app: operator-demo
  template:
    metadata:
      labels:
        app: operator-demo
    spec:
      containers:
        - name: web
          image: nginx:1.27
