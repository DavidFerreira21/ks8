apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: appenvironments.learning.example
  annotations:
    learning-path.example/lab-id: "03.06"
spec:
  group: learning.example
  scope: Namespaced
  names:
    plural: appenvironments
    singular: appenvironment
    kind: AppEnvironment
    shortNames: [appenv]
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [tier]
              properties:
                tier:
                  type: string
                  enum: [sandbox, staging, production]
