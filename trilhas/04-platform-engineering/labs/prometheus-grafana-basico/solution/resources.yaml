apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-demo
  namespace: lab-04-04
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrics-demo
  template:
    metadata:
      labels:
        app: metrics-demo
    spec:
      containers:
        - name: exporter
          image: quay.io/prometheus/node-exporter:v1.9.1
          ports:
            - containerPort: 9100
              name: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-demo
  namespace: lab-04-04
  labels:
    app: metrics-demo
spec:
  selector:
    app: metrics-demo
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: metrics-demo
  namespace: lab-04-04
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames: [lab-04-04]
  selector:
    matchLabels:
      app: metrics-demo
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
