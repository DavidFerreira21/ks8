apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xenvironments.platform.example.org
spec:
  scope: Namespaced
  group: platform.example.org
  names:
    kind: XEnvironment
    plural: xenvironments
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [tier]
              properties:
                tier:
                  type: string
                  enum: [sandbox, staging]
