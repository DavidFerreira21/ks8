apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: estudo-sem-provisionar
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: nao-configurada
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: [amd64]
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]
  limits:
    nodes: 0
