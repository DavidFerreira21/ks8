apiVersion: v1
kind: Pod
metadata:
  name: backend
  namespace: lab-04-03
  labels:
    app: backend
spec:
  containers:
    - name: nginx
      image: nginx:1.27
---
apiVersion: v1
kind: Pod
metadata:
  name: frontend
  namespace: lab-04-03
  labels:
    role: frontend
spec:
  containers:
    - name: client
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: externo
  namespace: lab-04-03
  labels:
    role: outsider
spec:
  containers:
    - name: client
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: apenas-frontend
  namespace: lab-04-03
spec:
  endpointSelector:
    matchLabels:
      app: backend
  ingress:
    - fromEndpoints:
        - matchLabels:
            role: frontend
