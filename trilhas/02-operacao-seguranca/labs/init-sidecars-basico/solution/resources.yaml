apiVersion: v1
kind: Pod
metadata:
  name: auxiliares
  namespace: lab-02-05
spec:
  initContainers:
    - name: preparo
      image: busybox:1.36
      command: ["sh", "-c", "echo iniciando; sleep 2"]
    - name: observador
      image: busybox:1.36
      restartPolicy: Always
      command: ["sh", "-c", "while true; do sleep 30; done"]
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
