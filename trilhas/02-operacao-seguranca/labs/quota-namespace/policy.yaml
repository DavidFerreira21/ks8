apiVersion: v1
kind: ResourceQuota
metadata:
  name: pod-count
  namespace: lab-ops-quota
spec:
  hard:
    pods: "1"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: lab-ops-quota
spec:
  limits:
    - type: Container
      default:
        cpu: 200m
        memory: 128Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
