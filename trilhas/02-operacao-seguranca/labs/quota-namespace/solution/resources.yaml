apiVersion: v1
kind: ResourceQuota
metadata:
  name: pod-count
  namespace: lab-02-04
spec:
  hard:
    pods: "1"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: lab-02-04
spec:
  limits:
    - type: Container
      default:
        cpu: 200m
        memory: 128Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: demo-1
  namespace: lab-02-04
spec:
  containers:
    - name: app
      image: nginx:1.27
      ports:
        - containerPort: 80
