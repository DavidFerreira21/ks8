apiVersion: apps/v1
kind: Deployment
metadata:
  name: distribuida
  namespace: lab-02-08
spec:
  replicas: 2
  selector:
    matchLabels:
      app: distribuida
  template:
    metadata:
      labels:
        app: distribuida
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: distribuida
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - containerPort: 80
