apiVersion: batch/v1
kind: Job
metadata:
  name: tarefa
  namespace: lab-02-06
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: job
          image: busybox:1.36
          command: ["sh", "-c", "echo execucao-completa"]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: agenda
  namespace: lab-02-06
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: job
              image: busybox:1.36
              command: ["sh", "-c", "echo execucao-agendada"]
