apiVersion: v1
kind: Pod
metadata:
  name: policy-server
  namespace: lab-02-13
  labels:
    app: policy-server
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: client-allowed
  namespace: lab-02-13
  labels:
    role: allowed
spec:
  containers:
    - name: client
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: client-blocked
  namespace: lab-02-13
  labels:
    role: blocked
spec:
  containers:
    - name: client
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
