apiVersion: v1
kind: Pod
metadata:
  name: alvo
  namespace: lab-02-13
  labels:
    app: alvo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolar-ingress
  namespace: lab-02-13
spec:
  podSelector:
    matchLabels:
      app: alvo
  policyTypes: ["Ingress"]
  ingress: []
