id: "02.02"
title: "RBAC e ServiceAccount com menor privilégio"
namespace: lab-02-02
apply:
  - solution/resources.yaml
starter:
  - starter/resources.yaml
checks:
  - type: rbac
    service_account: lab-reader
    resource: pods
    verb: list
  - type: rbac-deny
    service_account: lab-reader
    resource: secrets
    verb: list
