apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab-reader
  namespace: lab-ops-rbac
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: lab-ops-rbac
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader-binding
  namespace: lab-ops-rbac
subjects:
  - kind: ServiceAccount
    name: lab-reader
    namespace: lab-ops-rbac
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
