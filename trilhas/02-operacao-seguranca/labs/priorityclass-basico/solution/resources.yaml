apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: lab-02-priority
  annotations:
    learning-path.example/lab-id: "02.09"
value: 1000
globalDefault: false
preemptionPolicy: Never
description: "Classe didática sem preempção"
---
apiVersion: v1
kind: Pod
metadata:
  name: prioritario
  namespace: lab-02-09
spec:
  priorityClassName: lab-02-priority
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
